<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cabeleleila Leila</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center font-sans px-4">

    <div class="bg-white p-8 rounded-2xl shadow-md max-w-md w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Entrar no Sistema</h2>
            <p class="text-gray-500 mt-2">Bem-vindo de volta ao salão da Leila!</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl text-sm mb-4 border border-red-100 text-center">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                <input type="email" name="email" required placeholder="seu@email.com"
                       class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition">
            </div>

            <button type="submit"
                    class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-xl shadow-sm transition mt-2">
                Entrar
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-500">
            Ainda não tem uma conta?
            <a href="/cadastro/" class="text-pink-600 hover:underline font-medium">Criar conta</a>
        </div>

        <div class="text-center mt-2 text-xs">
            <a href="{% url 'index' %}" class="text-gray-400 hover:text-gray-600">Voltar para o início</a>
        </div>
    </div>

</body>
</html>
